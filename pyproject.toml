[project]
name = "irmas_torch"
version = "0.1.0"
description = "CNNs for predominant instrument recognition on the IRMAS dataset"
authors = [{ name = "Cézar Lemos", email = "cezarcbl@protonmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "torch>=2.9",
    "torchaudio>=2.9",
    "torchvision>=0.24",
    "lightning>=2.5",
    "torchmetrics>=1.8",
    "numpy>=2.3",
    "scipy>=1.16",
    "scikit-learn>=1.7",
    "hydra-core>=1.4.0rc3",
    "soundfile>=0.13",
    "tensorboard>=2.20",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "black>=25.9",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
